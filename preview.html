<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de configuración electrónica</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f3f4f6;
  font-family: Arial, sans-serif;
  color: #222;
}

.card {
  max-width: 720px;
  margin: 20px auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.10);
}

h1 {
  text-align: center;
  margin-top: 0;
}

.counter {
  text-align: center;
  color: #666;
  margin-bottom: 12px;
}

.progress {
  height: 10px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 25px;
}

.progress-bar {
  height: 100%;
  width: 0;
  background: #2563eb;
  transition: .25s;
}

.atomic {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin: 20px 0 28px;
}

label {
  display: block;
  font-weight: bold;
  margin: 15px 0 7px;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #bbb;
  border-radius: 9px;
  font-size: 17px;
  outline: none;
}

input:focus {
  border-color: #2563eb;
}

.config-input {
  font-family: "Times New Roman", serif;
}

button.check {
  width: 100%;
  padding: 14px;
  margin-top: 24px;
  border: 0;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button.check:hover {
  background: #1d4ed8;
}

.feedback {
  margin-top: 18px;
  padding: 12px;
  border-radius: 9px;
  display: none;
}

.ok {
  background: #dcfce7;
  color: #166534;
}

.bad {
  background: #fee2e2;
  color: #991b1b;
}

.score {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="card">

  <h1>Test de configuración electrónica</h1>

  <div class="counter" id="counter"></div>

  <div class="progress">
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="atomic" id="atomic"></div>

  <label>Configuración electrónica completa</label>

  <input
    id="config"
    class="config-input"
    autocomplete="off"
    placeholder="Ej.: 1s2 2s2 2p6"
  >

  <label>Configuración electrónica de la capa de valencia</label>

  <input
    id="valence"
    autocomplete="off"
    placeholder="Ej.: 3s2 3p5"
  >

  <label>Grupo</label>

  <input
    id="group"
    type="text"
    inputmode="numeric"
    autocomplete="off"
  >

  <label>Período</label>

  <input
    id="period"
    type="text"
    inputmode="numeric"
    autocomplete="off"
  >

  <label>n</label>

  <input
    id="n"
    type="text"
    inputmode="numeric"
    autocomplete="off"
  >

  <label>l</label>

  <input
    id="l"
    type="text"
    inputmode="numeric"
    autocomplete="off"
  >

  <label>mₗ</label>

  <input
    id="ml"
    type="text"
    inputmode="numeric"
    autocomplete="off"
  >

  <label>nº spin</label>

  <input
    id="spin"
    type="text"
    autocomplete="off"
    placeholder="Ej.: +1/2 o −1/2"
  >

  <button class="check" id="check">
    Comprobar
  </button>

  <div id="feedback" class="feedback"></div>

</div>


<script>

/*
===========================================================
ELEMENTOS 1-50
===========================================================
Formato:

Z
Símbolo
Configuración electrónica completa
Configuración de la capa de valencia
Grupo
Período
l del electrón diferenciador
m_l de referencia
spin de referencia
===========================================================
*/

const elements = [

[2,"He","1s2","1s2",18,1,0,0,"-1/2"],

[14,"Si","1s2 2s2 2p6 3s2 3p2","3s2 3p2",14,3,1,-1,"+1/2"],

[17,"Cl","1s2 2s2 2p6 3s2 3p5","3s2 3p5",17,3,1,-1,"-1/2"],

[19,"K","1s2 2s2 2p6 3s2 3p6 4s1","4s1",1,4,0,0,"+1/2"],

[21,"Sc","1s2 2s2 2p6 3s2 3p6 4s2 3d1","4s2",3,4,2,-2,"+1/2"],

[23,"V","1s2 2s2 2p6 3s2 3p6 4s2 3d3","4s2",5,4,2,0,"+1/2"],

[24,"Cr","1s2 2s2 2p6 3s2 3p6 4s1 3d5","4s1",6,4,2,2,"+1/2"],

[42,"Mo","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d5","5s1",6,5,2,0,"+1/2"],
[43,"Tc","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d5","5s2",7,5,2,0,"-1/2"],
[44,"Ru","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d7","5s1",8,5,2,0,"-1/2"],
[45,"Rh","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d8","5s1",9,5,2,0,"-1/2"],
[46,"Pd","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 4d10","4d10",10,5,2,0,"-1/2"],
[47,"Ag","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s1 4d10","5s1",11,5,2,0,"-1/2"],
[48,"Cd","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10","5s2",12,5,2,0,"-1/2"],
[49,"In","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p1","5s2 5p1",13,5,1,-1,"+1/2"],
[50,"Sn","1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p6 5s2 4d10 5p2","5s2 5p2",14,5,1,-1,"+1/2"]

];


/*
===========================================================
MEZCLAR PREGUNTAS
===========================================================
*/

function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];
  }

  return array;
}


/*
===========================================================
NORMALIZAR RESPUESTAS
===========================================================
*/

function normalize(text) {

  return text
    .toLowerCase()
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, function(c) {

      const supers = {
        "⁰":"0",
        "¹":"1",
        "²":"2",
        "³":"3",
        "⁴":"4",
        "⁵":"5",
        "⁶":"6",
        "⁷":"7",
        "⁸":"8",
        "⁹":"9"
      };

      return supers[c];

    })
    .replace(/\s+/g, "")
    .replace(/−/g, "-");
}


/*
===========================================================
VARIABLES
===========================================================
*/

let questions = [];

let index = 0;

let score = 0;


/*
===========================================================
MOSTRAR PREGUNTA
===========================================================
*/

function showQuestion() {

  const q = questions[index];

  document.getElementById("counter").textContent =
    `Pregunta ${index + 1} de ${questions.length}`;

  document.getElementById("progress").style.width =
    ((index / questions.length) * 100) + "%";

  /*
  Solo mostramos el número atómico.
  */

  document.getElementById("atomic").textContent =
    `Z = ${q[0]}`;

  document.getElementById("feedback").style.display = "none";

  document
    .querySelectorAll("input")
    .forEach(input => input.value = "");

  document.getElementById("check").textContent = "Comprobar";

  document.getElementById("check").onclick = check;

}


/*
===========================================================
COMPROBAR CONFIGURACIÓN
===========================================================
*/

function sameConfig(user, correct) {

  return normalize(user) === normalize(correct);

}


/*
===========================================================
COMPROBAR RESPUESTA
===========================================================
*/

function check() {

  const q = questions[index];

  const config =
    document.getElementById("config").value;

  const valence =
    document.getElementById("valence").value;

  const group =
    document.getElementById("group").value.trim();

  const period =
    document.getElementById("period").value.trim();

  const n =
    document.getElementById("n").value.trim();

  const l =
    document.getElementById("l").value.trim();

  const ml =
    document.getElementById("ml").value.trim();

  const spin =
    document.getElementById("spin").value
      .trim()
      .replace("−","-");


  /*
  m_l puede tener cualquier valor entero
  entre -l y +l.
  */

  const mlCorrecto =
    Number.isInteger(Number(ml)) &&
    Number(ml) >= -Number(l) &&
    Number(ml) <= Number(l);


  /*
  El spin puede ser +1/2 o -1/2.
  */

  const spinCorrecto =
    /^[-+]?1\s*\/\s*2$/.test(spin);


  const correct = [

    sameConfig(config, q[2]),

    sameConfig(valence, q[3]),

    group == q[4],

    period == q[5],

    n == q[5],

    l == q[6],

    mlCorrecto,

    spinCorrecto

  ];


  const ok = correct.every(Boolean);


  const feedback =
    document.getElementById("feedback");


  if (ok) {

    score++;

    feedback.className = "feedback ok";

    feedback.innerHTML =
      "<strong>✓ Correcto.</strong> Todos los apartados están bien.";

  }

  else {

    feedback.className = "feedback bad";

    feedback.innerHTML = `
      <strong>✗ Hay algún error.</strong><br><br>

      Configuración electrónica:
      ${q[2]}<br>

      Capa de valencia:
      ${q[3]}<br>

      Grupo:
      ${q[4]}<br>

      Período:
      ${q[5]}<br>

      n:
      ${q[5]}<br>

      l:
      ${q[6]}<br>

      mₗ:
      cualquier valor entre ${-q[6]} y ${q[6]}<br>

      nº spin:
      +1/2 o −1/2
    `;

  }


  feedback.style.display = "block";


  document.getElementById("check").textContent =
    index === questions.length - 1
      ? "Ver resultado"
      : "Siguiente";


  document.getElementById("check").onclick = next;

}


/*
===========================================================
SIGUIENTE PREGUNTA
===========================================================
*/

function next() {

  index++;


  if (index >= questions.length) {

    document.querySelector(".card").innerHTML = `

      <h1>Test terminado</h1>

      <div class="score">
        Puntuación: ${score} / ${questions.length}
      </div>

      <button
        class="check"
        onclick="location.reload()">

        Repetir test
        (nuevo orden)

      </button>

    `;

    return;
  }


  showQuestion();

}


/*
===========================================================
INICIAR TEST
===========================================================
*/

questions = shuffle([...elements]);

showQuestion();

</script>

</body>
</html>
